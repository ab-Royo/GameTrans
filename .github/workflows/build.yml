name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/GameTrans/GameTrans.csproj

      - name: Build
        run: dotnet build src/GameTrans/GameTrans.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/GameTrans/GameTrans.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: Self-test
        run: dist/GameTrans.exe --selftest out --headless

      - uses: actions/upload-artifact@v4
        with:
          name: GameTrans-win-x64
          path: dist/GameTrans.exe
